<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="12" fill="url(#pBg)"/>
  <rect width="400" height="300" rx="12" fill="rgba(0,0,0,0.65)"/>

  <!-- Pause icon -->
  <text x="200" y="65" text-anchor="middle" font-family="Arial" font-size="40">⏸️</text>

  <!-- Title -->
  <text x="200" y="110" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="url(#pGrad)">Tạm Dừng</text>

  <!-- Subtitle -->
  <text x="200" y="140" text-anchor="middle" font-family="Arial" font-size="13" fill="#a0a0b0">Game đang tạm dừng</text>

  <!-- Resume button -->
  <rect x="125" y="165" width="150" height="40" rx="8" fill="url(#pGrad)"/>
  <text x="200" y="191" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">▶ Tiếp Tục</text>

  <!-- Hint -->
  <text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#6c6c80">Nhấn Space hoặc P để tiếp tục</text>

  <!-- Decorative snake segments faded -->
  <g opacity="0.15">
    <rect x="50" y="260" width="14" height="14" rx="2" fill="#00c853"/>
    <rect x="66" y="260" width="14" height="14" rx="2" fill="#00c853"/>
    <rect x="82" y="260" width="14" height="14" rx="2" fill="#00c853"/>
    <rect x="98" y="260" width="14" height="14" rx="2" fill="#00c853"/>
    <rect x="114" y="260" width="14" height="14" rx="2" fill="#00e676"/>
  </g>

  <rect x="1" y="1" width="398" height="298" rx="11" fill="none" stroke="#2a2a4a" stroke-width="1"/>
</svg>
