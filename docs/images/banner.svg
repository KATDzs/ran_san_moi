<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#00c853"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="white" stroke-width="0.5">
    <line x1="0" y1="20" x2="800" y2="20"/>
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Snake body illustration -->
  <g transform="translate(50, 60)">
    <!-- Snake body segments -->
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#00a844" opacity="0.6"/>
    <rect x="20" y="0" width="18" height="18" rx="3" fill="#00a844" opacity="0.7"/>
    <rect x="40" y="0" width="18" height="18" rx="3" fill="#00c853" opacity="0.8"/>
    <rect x="60" y="0" width="18" height="18" rx="3" fill="#00c853" opacity="0.9"/>
    <rect x="80" y="0" width="18" height="18" rx="3" fill="#00c853"/>
    <!-- Snake head -->
    <rect x="100" y="0" width="18" height="18" rx="3" fill="#00e676"/>
    <circle cx="112" cy="5" r="2.5" fill="white"/>
    <circle cx="112" cy="13" r="2.5" fill="white"/>
    <circle cx="113" cy="5" r="1.2" fill="black"/>
    <circle cx="113" cy="13" r="1.2" fill="black"/>
  </g>

  <!-- Food -->
  <circle cx="160" cy="69" r="7" fill="#ff5252" opacity="0.9"/>
  <circle cx="158" cy="67" r="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Title -->
  <text x="400" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)">
    🐍 Rắn Săn Mồi
  </text>

  <!-- Subtitle -->
  <text x="400" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a0a0b0">
    Web Game bằng Java Spring Boot &amp; HTML5 Canvas
  </text>

  <!-- Tech badges -->
  <g transform="translate(240, 140)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#16213e" stroke="#2a2a4a"/>
    <text x="30" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d2ff">Java 17</text>

    <rect x="70" y="0" width="85" height="24" rx="12" fill="#16213e" stroke="#2a2a4a"/>
    <text x="112" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d2ff">Spring Boot</text>

    <rect x="165" y="0" width="60" height="24" rx="12" fill="#16213e" stroke="#2a2a4a"/>
    <text x="195" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d2ff">Canvas</text>

    <rect x="235" y="0" width="50" height="24" rx="12" fill="#16213e" stroke="#2a2a4a"/>
    <text x="260" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#00d2ff">Maven</text>
  </g>

  <!-- Decorative border -->
  <rect x="2" y="2" width="796" height="196" rx="11" fill="none" stroke="url(#textGrad)" stroke-width="1" opacity="0.3"/>
</svg>
