<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" rx="8" fill="url(#bg)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="700" height="45" rx="8" fill="#1a1a2e"/>
  <rect x="0" y="30" width="700" height="15" fill="#1a1a2e"/>
  <line x1="0" y1="45" x2="700" y2="45" stroke="#2a2a4a" stroke-width="1"/>
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#00d2ff">🐍 Rắn Săn Mồi</text>
  <text x="640" y="30" font-family="Arial" font-size="11" fill="#6c6c80">v1.0.0</text>

  <!-- Game canvas area -->
  <rect x="20" y="60" width="400" height="370" rx="8" fill="#0a0a15" stroke="#2a2a4a" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="40" y1="60" x2="40" y2="430"/><line x1="60" y1="60" x2="60" y2="430"/>
    <line x1="80" y1="60" x2="80" y2="430"/><line x1="100" y1="60" x2="100" y2="430"/>
    <line x1="120" y1="60" x2="120" y2="430"/><line x1="140" y1="60" x2="140" y2="430"/>
    <line x1="160" y1="60" x2="160" y2="430"/><line x1="180" y1="60" x2="180" y2="430"/>
    <line x1="200" y1="60" x2="200" y2="430"/><line x1="220" y1="60" x2="220" y2="430"/>
    <line x1="240" y1="60" x2="240" y2="430"/><line x1="260" y1="60" x2="260" y2="430"/>
    <line x1="280" y1="60" x2="280" y2="430"/><line x1="300" y1="60" x2="300" y2="430"/>
    <line x1="320" y1="60" x2="320" y2="430"/><line x1="340" y1="60" x2="340" y2="430"/>
    <line x1="360" y1="60" x2="360" y2="430"/><line x1="380" y1="60" x2="380" y2="430"/>
    <line x1="400" y1="60" x2="400" y2="430"/>
    <line x1="20" y1="80" x2="420" y2="80"/><line x1="20" y1="100" x2="420" y2="100"/>
    <line x1="20" y1="120" x2="420" y2="120"/><line x1="20" y1="140" x2="420" y2="140"/>
    <line x1="20" y1="160" x2="420" y2="160"/><line x1="20" y1="180" x2="420" y2="180"/>
    <line x1="20" y1="200" x2="420" y2="200"/><line x1="20" y1="220" x2="420" y2="220"/>
    <line x1="20" y1="240" x2="420" y2="240"/><line x1="20" y1="260" x2="420" y2="260"/>
    <line x1="20" y1="280" x2="420" y2="280"/><line x1="20" y1="300" x2="420" y2="300"/>
    <line x1="20" y1="320" x2="420" y2="320"/><line x1="20" y1="340" x2="420" y2="340"/>
    <line x1="20" y1="360" x2="420" y2="360"/><line x1="20" y1="380" x2="420" y2="380"/>
    <line x1="20" y1="400" x2="420" y2="400"/><line x1="20" y1="420" x2="420" y2="420"/>
  </g>

  <!-- Snake body -->
  <rect x="100" y="200" width="18" height="18" rx="3" fill="#00a844"/>
  <rect x="120" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="140" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="160" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="180" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="200" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="220" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="240" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="260" y="200" width="18" height="18" rx="3" fill="#00c853"/>
  <!-- Snake turning up -->
  <rect x="260" y="180" width="18" height="18" rx="3" fill="#00c853"/>
  <rect x="260" y="160" width="18" height="18" rx="3" fill="#00c853"/>
  <!-- Snake head -->
  <rect x="260" y="140" width="18" height="18" rx="3" fill="#00e676"/>
  <circle cx="265" cy="147" r="2" fill="white"/><circle cx="273" cy="147" r="2" fill="white"/>
  <circle cx="265" cy="147" r="1" fill="black"/><circle cx="273" cy="147" r="1" fill="black"/>

  <!-- Food -->
  <circle cx="329" cy="309" r="8" fill="#ff5252"/>
  <circle cx="327" cy="307" r="2.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Score panel -->
  <rect x="440" y="60" width="240" height="120" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <rect x="440" y="60" width="240" height="32" rx="8" fill="#1a1a3e"/>
  <rect x="440" y="80" width="240" height="12" fill="#1a1a3e"/>
  <text x="460" y="82" font-family="Arial" font-size="12" font-weight="bold" fill="#e0e0e0">🏆 Bảng Điểm</text>
  <text x="460" y="115" font-family="Arial" font-size="11" fill="#a0a0b0">Điểm hiện tại</text>
  <text x="650" y="115" text-anchor="end" font-family="Arial" font-size="16" font-weight="bold" fill="#00d2ff">120</text>
  <text x="460" y="140" font-family="Arial" font-size="11" fill="#a0a0b0">Điểm cao nhất</text>
  <text x="650" y="140" text-anchor="end" font-family="Arial" font-size="16" font-weight="bold" fill="#ffd740">350</text>
  <text x="460" y="165" font-family="Arial" font-size="11" fill="#a0a0b0">Chiều dài rắn</text>
  <text x="650" y="165" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold" fill="#e0e0e0">15</text>

  <!-- Settings panel -->
  <rect x="440" y="195" width="240" height="100" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <rect x="440" y="195" width="240" height="32" rx="8" fill="#1a1a3e"/>
  <rect x="440" y="215" width="240" height="12" fill="#1a1a3e"/>
  <text x="460" y="217" font-family="Arial" font-size="12" font-weight="bold" fill="#e0e0e0">⚙️ Cài Đặt</text>
  <text x="460" y="250" font-family="Arial" font-size="10" fill="#6c6c80">CHẾ ĐỘ CHƠI</text>
  <rect x="460" y="257" width="60" height="22" rx="10" fill="#00d2ff"/>
  <text x="490" y="272" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="white">Classic</text>
  <rect x="525" y="257" width="50" height="22" rx="10" fill="#0f0f1a" stroke="#2a2a4a"/>
  <text x="550" y="272" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0a0b0">Wrap</text>

  <!-- Status panel -->
  <rect x="440" y="310" width="240" height="70" rx="8" fill="#16213e" stroke="#2a2a4a"/>
  <rect x="440" y="310" width="240" height="32" rx="8" fill="#1a1a3e"/>
  <rect x="440" y="330" width="240" height="12" fill="#1a1a3e"/>
  <text x="460" y="332" font-family="Arial" font-size="12" font-weight="bold" fill="#e0e0e0">📊 Trạng Thái</text>
  <text x="460" y="360" font-family="Arial" font-size="11" fill="#6c6c80">Trạng thái:</text>
  <rect x="540" y="348" width="65" height="18" rx="9" fill="rgba(0,230,118,0.15)"/>
  <text x="572" y="361" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#00e676">Đang chơi</text>

  <!-- Border -->
  <rect x="1" y="1" width="698" height="448" rx="7" fill="none" stroke="#2a2a4a" stroke-width="1"/>
</svg>
